<!DOCTYPE html>
<html lang="en">

<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Teacher login for Gospel Music Mastery">
    <meta name="keywords" content="">

    <!-- title -->
    <title>Teacher Login - Gospel Music Mastery</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/logo/favicon.png">

    <!-- css -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all-fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/magnific-popup.min.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gospel-custom.css">
    <link rel="stylesheet" href="assets/css/gospel-animations.css">
    <link rel="stylesheet" href="assets/css/form-feedback.css">
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/form-validation.js"></script>

</head>

<body>

    <!-- preloader -->
    <div class="preloader">
        <div class="loader-book">
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
        </div>
    </div>
    <!-- preloader end -->

<main class="main">

<!-- teacher login area -->
        <div class="login-area py-120">
            <div class="container">
                <div class="col-md-5 mx-auto">
                    <div class="login-form">
                        <div class="login-header">
                            <span class="login-portal-badge">Teacher Portal</span>
                            <h2>Welcome Back</h2>
                            <p class="login-desc">Sign in to manage your profile, classes, availability, bookings, and earnings.</p>
                        </div>
                        <form action="#" method="post" id="teacher-login-form" novalidate>
                            <div class="form-group">
                                <label for="teacher-username">Username or Email</label>
                                <input type="text" class="form-control" id="teacher-username" name="username"
                                    placeholder="Enter username or email" autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label for="teacher-password">Password</label>
                                <div class="password-field">
                                    <input type="password" class="form-control" id="teacher-password" name="password"
                                        placeholder="Enter your password" autocomplete="current-password">
                                    <button type="button" class="password-toggle" id="password-toggle"
                                        aria-label="Show password" title="Show password">
                                        <i class="far fa-eye" id="password-toggle-icon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="" id="keep-signed-in">
                                    <label class="form-check-label" for="keep-signed-in">
                                        Keep me signed in
                                    </label>
                                </div>
                                <a href="forgot-password.html" class="forgot-pass">Forgot Password?</a>
                            </div>
                            <div class="d-flex align-items-center">
                                <button type="submit" class="theme-btn"><i class="far fa-sign-in"></i> Sign In</button>
                            </div>
                        </form>
                        <div class="login-footer">
                            <p>New to Gospel Music Mastery? <a href="teacher-register.html">Register as a Teacher</a></p>
                            <p>Student or admin? <a href="login.html">Choose another portal</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- teacher login area end -->

    </main>

<!-- js -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/modernizr.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/isotope.pkgd.min.js"></script>
    <script src="assets/js/jquery.appear.min.js"></script>
    <script src="assets/js/jquery.easing.min.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/counter-up.js"></script>
    <script src="assets/js/wow.min.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- password visibility toggle + demo login redirect -->
    <script>
        (function () {
            var toggle = document.getElementById('password-toggle');
            var input = document.getElementById('teacher-password');
            var icon = document.getElementById('password-toggle-icon');
            if (toggle && input && icon) {
                toggle.addEventListener('click', function () {
                    var isHidden = input.type === 'password';
                    input.type = isHidden ? 'text' : 'password';
                    icon.classList.toggle('fa-eye', !isHidden);
                    icon.classList.toggle('fa-eye-slash', isHidden);
                    toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
                    toggle.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
                });
            }

            var form = document.getElementById('teacher-login-form');
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    window.location.href = 'teacher-dashboard.html';
                });
            }
        })();
    </script>

</body>

</html>
