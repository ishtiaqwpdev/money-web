<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Monitor teacher and student messages">
    <title>Messages - Admin - Gospel Music Mastery</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo/favicon.png">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all-fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/magnific-popup.min.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gospel-custom.css">
    <link rel="stylesheet" href="assets/css/gospel-animations.css">
    <link rel="stylesheet" href="assets/css/gospel-responsive.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/components.js"></script>
</head>

<body class="admin-portal-page">

<main class="main">
        <div class="admin-dashboard-area py-120">
            <div class="container">

                <header class="sd-profile-header ad-topbar">
                    <div class="sd-profile-main ad-topbar-main">
                        <div class="sd-profile-avatar ad-topbar-avatar">
                            <img src="assets/img/team/01.jpg" alt="Administrator">
                        </div>
                        <div class="sd-profile-meta">
                            <h2>Administrator</h2>
                            <span class="sd-role">Platform Admin</span>
                        </div>
                    </div>
                    <div class="ad-topbar-actions">
                        <a href="admin-messages.html" class="ad-icon-btn" aria-label="Messages">
                            <i class="far fa-envelope"></i>
                        </a>
                        <a href="admin-login.html" class="theme-btn theme-btn-outline">Logout</a>
                    </div>
                </header>

                <div class="sd-shell ad-shell">
                    <button type="button" class="sd-sidebar-toggle theme-btn theme-btn-outline" id="sd-sidebar-toggle"
                        aria-expanded="false" aria-controls="sd-sidebar">
                        <i class="far fa-bars"></i> Menu
                    </button>

                    <aside class="sd-sidebar ad-sidebar" id="sd-sidebar" aria-label="Admin navigation">
                        <nav class="sd-nav ad-nav">
                            <ul>
                                <li><a href="admin-dashboard.html" class="sd-nav-link" data-nav="dashboard"><i class="far fa-grid-2"></i> Dashboard</a></li>
                                <li class="ad-nav-group is-open" id="ad-users-group">
                                    <button type="button" class="sd-nav-link ad-nav-parent" id="ad-users-toggle"
                                        aria-expanded="true" aria-controls="ad-users-submenu">
                                        <i class="far fa-users"></i> Users
                                        <i class="far fa-angle-down ad-nav-caret"></i>
                                    </button>
                                    <ul class="ad-submenu" id="ad-users-submenu">
                                        <li><a href="admin-teachers.html" class="sd-nav-link ad-sub-link" data-nav="teachers"><i class="far fa-chalkboard-user"></i> Teachers</a></li>
                                        <li><a href="admin-students.html" class="sd-nav-link ad-sub-link" data-nav="students"><i class="far fa-graduation-cap"></i> Students</a></li>
                                    </ul>
                                </li>
                                <li><a href="admin-classes.html" class="sd-nav-link" data-nav="classes"><i class="far fa-chalkboard"></i> Classes</a></li>
                                <li><a href="admin-bookings.html" class="sd-nav-link" data-nav="bookings"><i class="far fa-calendar-check"></i> Bookings</a></li>
                                <li><a href="admin-messages.html" class="sd-nav-link active" data-nav="messages"><i class="far fa-comments"></i> Messages</a></li>
                                <li><a href="admin-payments.html" class="sd-nav-link" data-nav="payments"><i class="far fa-credit-card"></i> Payments</a></li>
                                <li><a href="admin-programs.html" class="sd-nav-link" data-nav="programs"><i class="far fa-music"></i> Music Programs</a></li>
                                <li><a href="admin-settings.html" class="sd-nav-link" data-nav="settings"><i class="far fa-gear"></i> Settings</a></li>
                                <li><a href="admin-login.html" class="sd-nav-link sd-nav-logout" data-nav="logout"><i class="far fa-right-from-bracket"></i> Logout</a></li>
                            </ul>
                        </nav>
                    </aside>
                    <div class="sd-sidebar-backdrop" id="sd-sidebar-backdrop" hidden></div>

                    <div class="sd-main ad-main">
                        <section class="sd-card sd-welcome-card">
                            <div class="sd-card-head">
                                <div>
                                    <span class="login-portal-badge">Moderation</span>
                                    <h3>All Platform Messages</h3>
                                    <p>View teacher ↔ student conversations across the platform (read-only).</p>
                                </div>
                            </div>
                        </section>

                        <section class="sd-card gmm-msg-card">
                            <div class="gmm-msg-layout">
                                <aside class="gmm-msg-list" id="gmm-msg-list" aria-label="Conversations"></aside>
                                <div class="gmm-msg-chat" id="gmm-msg-chat" aria-label="Chat"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
</main>

<script src="assets/js/jquery-3.7.1.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/messages.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.GmmMessages) {
            GmmMessages.mountInbox({
                role: 'admin',
                listEl: '#gmm-msg-list',
                chatEl: '#gmm-msg-chat'
            });
        }
    });
</script>
</body>
</html>
