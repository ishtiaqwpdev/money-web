<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Message your gospel music teachers">
    <title>Messages - Gospel Music Mastery</title>
    <link rel="icon" type="image/x-icon" href="assets/img/logo/favicon.png">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all-fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/magnific-popup.min.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gospel-custom.css">
    <link rel="stylesheet" href="assets/css/gospel-animations.css">
    <link rel="stylesheet" href="assets/css/gospel-responsive.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/components.js"></script>
</head>

<body class="student-portal-page">

<main class="main">
        <div class="student-dashboard-area py-120">
            <div class="container">

                <div class="sd-profile-header">
                    <div class="sd-profile-main">
                        <div class="sd-profile-avatar">
                            <img src="assets/img/team/02.jpg" alt="Sarah Johnson">
                        </div>
                        <div class="sd-profile-meta">
                            <h2>Sarah Johnson</h2>
                            <span class="sd-role">Music Student</span>
                            <div class="sd-profile-stats">
                                <span class="sd-stat-item"><i class="far fa-signal"></i> Learning Level: Intermediate</span>
                                <span class="sd-stat-item"><i class="far fa-music"></i> Gospel Piano</span>
                            </div>
                        </div>
                    </div>
                    <div class="sd-profile-actions">
                        <a href="teachers.html" class="theme-btn"><i class="far fa-calendar-plus"></i> Book a Lesson</a>
                    </div>
                </div>

                <div class="sd-shell">
                    <button type="button" class="sd-sidebar-toggle theme-btn theme-btn-outline" id="sd-sidebar-toggle"
                        aria-expanded="false" aria-controls="sd-sidebar">
                        <i class="far fa-bars"></i> Menu
                    </button>

                    <aside class="sd-sidebar" id="sd-sidebar" aria-label="Student navigation">
                        <nav class="sd-nav">
                            <ul>
                                <li><a href="student-dashboard.html" class="sd-nav-link" data-nav="dashboard"><i class="far fa-grid-2"></i> Dashboard</a></li>
                                <li><a href="student-profile.html" class="sd-nav-link" data-nav="profile"><i class="far fa-user"></i> My Profile</a></li>
                                <li><a href="student-lessons.html" class="sd-nav-link" data-nav="lessons"><i class="far fa-book-open"></i> My Lessons</a></li>
                                <li><a href="student-bookings.html" class="sd-nav-link" data-nav="bookings"><i class="far fa-calendar-check"></i> My Bookings</a></li>
                                <li><a href="student-messages.html" class="sd-nav-link active" data-nav="messages"><i class="far fa-comments"></i> Messages</a></li>
                                <li><a href="student-favourites.html" class="sd-nav-link" data-nav="favourites"><i class="far fa-heart"></i> Favourite Teachers</a></li>
                                <li><a href="student-payments.html" class="sd-nav-link" data-nav="payments"><i class="far fa-credit-card"></i> Payments</a></li>
                                <li><a href="student-settings.html" class="sd-nav-link" data-nav="settings"><i class="far fa-gear"></i> Settings</a></li>
                                <li><a href="student-login.html" class="sd-nav-link sd-nav-logout" data-nav="logout"><i class="far fa-right-from-bracket"></i> Logout</a></li>
                            </ul>
                        </nav>
                    </aside>
                    <div class="sd-sidebar-backdrop" id="sd-sidebar-backdrop" hidden></div>

                    <div class="sd-main">
                        <section class="sd-card sd-welcome-card">
                            <div class="sd-card-head">
                                <div>
                                    <span class="login-portal-badge">Inbox</span>
                                    <h3>Messages</h3>
                                    <p>Chat with your teachers about lessons and practice.</p>
                                </div>
                            </div>
                        </section>

                        <section class="sd-card gmm-msg-card">
                            <div class="gmm-msg-layout">
                                <aside class="gmm-msg-list" id="gmm-msg-list" aria-label="Conversations"></aside>
                                <div class="gmm-msg-chat" id="gmm-msg-chat" aria-label="Chat"></div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
</main>

<script src="assets/js/jquery-3.7.1.min.js"></script>
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/messages.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (window.GmmMessages) {
            GmmMessages.mountInbox({
                role: 'student',
                listEl: '#gmm-msg-list',
                chatEl: '#gmm-msg-chat'
            });
        }
    });
</script>
</body>
</html>
