<!DOCTYPE html>
<html lang="en">

<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student login for Gospel Music Mastery">
    <meta name="keywords" content="">

    <!-- title -->
    <title>Student Login - Gospel Music Mastery</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/logo/favicon.png">

    <!-- css -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all-fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/magnific-popup.min.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gospel-custom.css">
    <link rel="stylesheet" href="assets/css/gospel-animations.css">
    <link rel="stylesheet" href="assets/css/form-feedback.css">
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/form-validation.js"></script>

</head>

<body class="public-site-page">

    <!-- preloader -->
    <div class="preloader">
        <div class="loader-book">
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
        </div>
    </div>
    <!-- preloader end --><main class="main"><!-- student login area -->
        <div class="login-area py-120">
            <div class="container">
                <div class="col-md-5 mx-auto">
                    <div class="login-form student-login-form">
                        <div class="login-header">
                            <span class="login-portal-badge">Student Portal</span>
                            <h2>Welcome Back Student</h2>
                            <p class="login-desc">Sign in to access your lessons, bookings, teachers, and learning dashboard.</p>
                        </div>

                        <div class="gospel-alert gospel-alert-error" id="student-login-error" hidden>
                            <i class="far fa-circle-exclamation"></i>
                            <span id="student-login-error-text">Please enter your email and password.</span>
                        </div>

                        <form action="#" method="post" id="student-login-form" novalidate>
                            <div class="form-group">
                                <label for="student-username">Email Address or Username</label>
                                <input type="text" class="form-control" id="student-username" name="username"
                                    placeholder="Enter email or username" autocomplete="username">
                                <span class="field-feedback" id="student-username-feedback"></span>
                            </div>
                            <div class="form-group">
                                <label for="student-password">Password</label>
                                <div class="password-field">
                                    <input type="password" class="form-control" id="student-password" name="password"
                                        placeholder="Enter your password" autocomplete="current-password">
                                    <button type="button" class="password-toggle" id="password-toggle"
                                        aria-label="Show password" title="Show password">
                                        <i class="far fa-eye" id="password-toggle-icon"></i>
                                    </button>
                                </div>
                                <span class="field-feedback" id="student-password-feedback"></span>
                            </div>
                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="1" id="remember-me">
                                    <label class="form-check-label" for="remember-me">
                                        Remember Me
                                    </label>
                                </div>
                                <a href="forgot-password.html?from=student" class="forgot-pass">Forgot Password?</a>
                            </div>
                            <div class="d-flex align-items-center">
                                <button type="submit" class="theme-btn w-100"><i class="far fa-sign-in"></i> Sign In</button>
                            </div>
                        </form>

                        <div class="login-footer">
                            <p>Don't have a student account? <a href="student-register.html">Register as Student</a></p>
                            <p>Teacher or admin? <a href="login.html">Choose another portal</a></p>
                        </div>

                        <div class="login-or-divider" aria-hidden="true">
                            <span>OR</span>
                        </div>

                        <div class="student-social-login">
                            <button type="button" class="theme-btn-outline student-social-btn" id="student-google-btn">
                                <i class="fab fa-google"></i> Continue with Google
                            </button>
                            <button type="button" class="theme-btn-outline student-social-btn" id="student-facebook-btn">
                                <i class="fab fa-facebook-f"></i> Continue with Facebook
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- student login area end -->

    </main><!-- js -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/modernizr.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/isotope.pkgd.min.js"></script>
    <script src="assets/js/jquery.appear.min.js"></script>
    <script src="assets/js/jquery.easing.min.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/counter-up.js"></script>
    <script src="assets/js/wow.min.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- student login interactions -->
    <script>
        (function () {
            var toggle = document.getElementById('password-toggle');
            var passwordInput = document.getElementById('student-password');
            var icon = document.getElementById('password-toggle-icon');
            var form = document.getElementById('student-login-form');
            var usernameInput = document.getElementById('student-username');
            var usernameFeedback = document.getElementById('student-username-feedback');
            var passwordFeedback = document.getElementById('student-password-feedback');
            var errorBox = document.getElementById('student-login-error');
            var errorText = document.getElementById('student-login-error-text');

            if (toggle && passwordInput && icon) {
                toggle.addEventListener('click', function () {
                    var isHidden = passwordInput.type === 'password';
                    passwordInput.type = isHidden ? 'text' : 'password';
                    icon.classList.toggle('fa-eye', !isHidden);
                    icon.classList.toggle('fa-eye-slash', isHidden);
                    toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
                    toggle.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
                });
            }

            function clearFieldState(input, feedback) {
                if (input) input.classList.remove('is-invalid');
                if (feedback) {
                    feedback.textContent = '';
                    feedback.classList.remove('is-invalid-feedback');
                }
            }

            function setInvalid(input, feedback, message) {
                if (input) input.classList.add('is-invalid');
                if (feedback) {
                    feedback.textContent = message;
                    feedback.classList.add('is-invalid-feedback');
                }
            }

            if (usernameInput) {
                usernameInput.addEventListener('input', function () {
                    clearFieldState(usernameInput, usernameFeedback);
                    if (errorBox) errorBox.hidden = true;
                });
            }

            if (passwordInput) {
                passwordInput.addEventListener('input', function () {
                    clearFieldState(passwordInput, passwordFeedback);
                    if (errorBox) errorBox.hidden = true;
                });
            }

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var valid = true;
                    var username = (usernameInput && usernameInput.value || '').trim();
                    var password = (passwordInput && passwordInput.value || '').trim();

                    clearFieldState(usernameInput, usernameFeedback);
                    clearFieldState(passwordInput, passwordFeedback);
                    if (errorBox) errorBox.hidden = true;

                    if (!username) {
                        setInvalid(usernameInput, usernameFeedback, 'Please enter your email or username.');
                        valid = false;
                    }

                    if (!password) {
                        setInvalid(passwordInput, passwordFeedback, 'Please enter your password.');
                        valid = false;
                    } else if (password.length < 6) {
                        setInvalid(passwordInput, passwordFeedback, 'Password must be at least 6 characters.');
                        valid = false;
                    }

                    if (!valid) {
                        if (errorText) errorText.textContent = 'Please fix the highlighted fields and try again.';
                        if (errorBox) errorBox.hidden = false;
                        return;
                    }

                    if (errorBox) {
                        errorBox.classList.remove('gospel-alert-error');
                        errorBox.classList.add('gospel-alert-success');
                        var iconEl = errorBox.querySelector('i');
                        if (iconEl) iconEl.className = 'far fa-circle-check';
                        errorBox.hidden = false;
                        if (errorText) errorText.textContent = 'Signed in successfully (demo). Redirecting to your dashboard…';
                    }
                    window.setTimeout(function () {
                        window.location.href = 'student-dashboard.html';
                    }, 900);
                });
            }

            function socialPlaceholder(provider) {
                if (!errorBox) return;
                errorBox.classList.remove('gospel-alert-success');
                errorBox.classList.add('gospel-alert-error');
                var iconEl = errorBox.querySelector('i');
                if (iconEl) iconEl.className = 'far fa-circle-info';
                if (errorText) {
                    errorText.textContent = provider + ' sign-in is a frontend placeholder only.';
                }
                errorBox.hidden = false;
            }

            var googleBtn = document.getElementById('student-google-btn');
            var facebookBtn = document.getElementById('student-facebook-btn');
            if (googleBtn) {
                googleBtn.addEventListener('click', function () {
                    socialPlaceholder('Google');
                });
            }
            if (facebookBtn) {
                facebookBtn.addEventListener('click', function () {
                    socialPlaceholder('Facebook');
                });
            }
        })();
    </script>

</body>

</html>
