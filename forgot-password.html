<!DOCTYPE html>
<html lang="en">

<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your instructor password for Gospel Music Mastery">
    <meta name="keywords" content="">

    <!-- title -->
    <title>Forgot Password - Gospel Music Mastery</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/logo/favicon.png">

    <!-- css -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all-fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/magnific-popup.min.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gospel-custom.css">

</head>

<body>

    <!-- preloader -->
    <div class="preloader">
        <div class="loader-book">
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
        </div>
    </div>
    <!-- preloader end -->

<main class="main">

<!-- forgot password area -->
        <div class="login-area py-120">
            <div class="container">
                <div class="col-md-5 mx-auto">
                    <div class="login-form">
                        <div class="login-header">
                            <span class="login-portal-badge">Instructor Portal</span>
                            <h2>Reset Your Password</h2>
                            <p class="login-desc">Enter the email address linked to your instructor account and we'll send you a link to reset your password (demo).</p>
                        </div>

                        <div class="gospel-alert gospel-alert-success" id="reset-success" hidden>
                            <i class="far fa-circle-check"></i>
                            <span>If an account exists for that email, a reset link has been sent (demo — no email is actually sent).</span>
                        </div>

                        <form action="#" method="post" id="forgot-password-form" novalidate>
                            <div class="form-group">
                                <label for="reset-email">Email Address</label>
                                <input type="email" class="form-control" id="reset-email" name="email"
                                    placeholder="Enter your email address" autocomplete="email">
                                <span class="field-feedback" data-for="reset-email"></span>
                            </div>
                            <div class="d-flex align-items-center">
                                <button type="submit" class="theme-btn"><i class="far fa-paper-plane"></i> Send Reset Link</button>
                            </div>
                        </form>
                        <div class="login-footer">
                            <p><a href="teacher-login.html"><i class="far fa-arrow-left"></i> Back to Sign In</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- forgot password area end -->

    </main>

<!-- js -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/modernizr.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/isotope.pkgd.min.js"></script>
    <script src="assets/js/jquery.appear.min.js"></script>
    <script src="assets/js/jquery.easing.min.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/counter-up.js"></script>
    <script src="assets/js/wow.min.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- forgot password demo interaction -->
    <script>
        (function () {
            var form = document.getElementById('forgot-password-form');
            if (!form) return;

            var emailInput = document.getElementById('reset-email');
            var successBox = document.getElementById('reset-success');

            function setFeedback(id, message, isInvalid) {
                var feedback = document.querySelector('.field-feedback[data-for="' + id + '"]');
                if (!feedback) return;
                feedback.textContent = message || '';
                feedback.classList.toggle('is-invalid-feedback', !!isInvalid);
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                successBox.hidden = true;
                emailInput.classList.remove('is-valid', 'is-invalid');
                setFeedback('reset-email', '', false);

                var value = emailInput.value.trim();
                var isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

                if (!isValidEmail) {
                    emailInput.classList.add('is-invalid');
                    setFeedback('reset-email', 'Please enter a valid email address.', true);
                    return;
                }

                emailInput.classList.add('is-valid');
                successBox.hidden = false;
                successBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        })();
    </script>

</body>

</html>
