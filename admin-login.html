<!DOCTYPE html>
<html lang="en">

<head>
    <!-- meta tags -->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for Gospel Music Mastery">
    <meta name="keywords" content="">

    <!-- title -->
    <title>Admin Login - Gospel Music Mastery</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/logo/favicon.png">

    <!-- css -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/all-fontawesome.min.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/css/magnific-popup.min.css">
    <link rel="stylesheet" href="assets/css/owl.carousel.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gospel-custom.css">

</head>

<body class="public-site-page">

    <!-- preloader -->
    <div class="preloader">
        <div class="loader-book">
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
            <div class="loader-book-page"></div>
        </div>
    </div>
    <!-- preloader end -->

    <main class="main">

        <!-- admin login area -->
        <div class="login-area py-120">
            <div class="container">
                <div class="col-md-5 mx-auto">
                    <div class="login-form">
                        <div class="login-header">
                            <span class="login-portal-badge">Admin Portal</span>
                            <h2>Administrator Sign In</h2>
                            <p class="login-desc">Sign in to manage users, classes, bookings, payments, and platform settings.</p>
                        </div>

                        <div class="gospel-alert gospel-alert-error" id="admin-login-error" hidden>
                            <i class="far fa-circle-exclamation"></i>
                            <span id="admin-login-error-text">Please enter your email and password.</span>
                        </div>

                        <form action="#" method="post" id="admin-login-form" novalidate>
                            <div class="form-group">
                                <label for="admin-username">Email Address or Username</label>
                                <input type="text" class="form-control" id="admin-username" name="username"
                                    placeholder="Enter email or username" autocomplete="username">
                            </div>
                            <div class="form-group">
                                <label for="admin-password">Password</label>
                                <div class="password-field">
                                    <input type="password" class="form-control" id="admin-password" name="password"
                                        placeholder="Enter your password" autocomplete="current-password">
                                    <button type="button" class="password-toggle" id="password-toggle"
                                        aria-label="Show password" title="Show password">
                                        <i class="far fa-eye" id="password-toggle-icon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="1" id="admin-remember">
                                    <label class="form-check-label" for="admin-remember">
                                        Remember Me
                                    </label>
                                </div>
                                <a href="forgot-password.html?from=admin" class="forgot-pass">Forgot Password?</a>
                            </div>
                            <div class="d-flex align-items-center">
                                <button type="submit" class="theme-btn w-100"><i class="far fa-sign-in"></i> Sign In</button>
                            </div>
                        </form>

                        <div class="login-footer">
                            <p>Looking for another portal? <a href="login.html">Choose login type</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- admin login area end -->

    </main>

    <!-- js -->
    <script src="assets/js/jquery-3.7.1.min.js"></script>
    <script src="assets/js/modernizr.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/imagesloaded.pkgd.min.js"></script>
    <script src="assets/js/jquery.magnific-popup.min.js"></script>
    <script src="assets/js/isotope.pkgd.min.js"></script>
    <script src="assets/js/jquery.appear.min.js"></script>
    <script src="assets/js/jquery.easing.min.js"></script>
    <script src="assets/js/owl.carousel.min.js"></script>
    <script src="assets/js/counter-up.js"></script>
    <script src="assets/js/wow.min.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        (function () {
            var toggle = document.getElementById('password-toggle');
            var input = document.getElementById('admin-password');
            var icon = document.getElementById('password-toggle-icon');
            var form = document.getElementById('admin-login-form');
            var errorBox = document.getElementById('admin-login-error');
            var errorText = document.getElementById('admin-login-error-text');

            if (toggle && input && icon) {
                toggle.addEventListener('click', function () {
                    var isHidden = input.type === 'password';
                    input.type = isHidden ? 'text' : 'password';
                    icon.classList.toggle('fa-eye', !isHidden);
                    icon.classList.toggle('fa-eye-slash', isHidden);
                    toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
                    toggle.setAttribute('title', isHidden ? 'Hide password' : 'Show password');
                });
            }

            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    var username = (document.getElementById('admin-username').value || '').trim();
                    var password = (input && input.value || '').trim();

                    if (!username || !password) {
                        if (errorText) errorText.textContent = 'Please enter your email and password.';
                        if (errorBox) {
                            errorBox.classList.remove('gospel-alert-success');
                            errorBox.classList.add('gospel-alert-error');
                            errorBox.hidden = false;
                        }
                        return;
                    }

                    if (errorBox) {
                        errorBox.classList.remove('gospel-alert-error');
                        errorBox.classList.add('gospel-alert-success');
                        var iconEl = errorBox.querySelector('i');
                        if (iconEl) iconEl.className = 'far fa-circle-check';
                        errorBox.hidden = false;
                        if (errorText) errorText.textContent = 'Signed in successfully (demo). Redirecting…';
                    }
                    window.setTimeout(function () {
                        window.location.href = 'admin-dashboard.html';
                    }, 900);
                });
            }
        })();
    </script>

</body>

</html>
